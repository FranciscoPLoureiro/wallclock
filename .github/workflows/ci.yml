name: CI

on:
  push:
    branches: [main]
  # No branch filter. Phases are built on branches that stack on the previous
  # one while it waits to be merged, and a pull request whose base is another
  # branch is still a pull request that has to be green before anyone reads
  # it. Restricting this to main meant the phase 1 branch ran no CI at all,
  # which was only noticed because the run list came back empty.
  pull_request:

# A run whose commit has already been superseded tells nobody anything and
# occupies a runner that the current commit needs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

# Every `run:` step gets `bash --noprofile --norc -eo pipefail` instead of the
# default `bash -e`, and the difference is pipefail.
#
# Without it a pipeline exits with the status of its *last* command, so
# `wallclock preflight | tee -a "$GITHUB_STEP_SUMMARY"` below reports what tee
# did, which is succeed. That step carries a comment saying it fails on a
# runner that cannot run this project, and it could not fail at all -- a check
# incapable of failing, in a repository whose recurring lesson is exactly
# that.
defaults:
  run:
    shell: bash

jobs:
  verify:
    name: build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Read the version from go.mod so the toolchain can never drift
          # away from what the module declares.
          go-version-file: go.mod
          cache: true

      - name: Install the BPF toolchain
        # clang cross-compiles to BPF, llvm supplies llvm-strip, and
        # libbpf-dev supplies the bpf_helpers.h the programs include. The
        # runner image already carries a clang, but not necessarily an
        # unversioned llvm-strip, and not libbpf's headers.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev

      - name: Verify go.mod is tidy
        # A stale go.mod passes locally and fails for the next person to
        # clone. Cheaper to catch here than in someone else's checkout.
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Compile the BPF programs
        run: make bpf

      - name: Build
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned rather than "latest": a new release adding a check should
          # be a deliberate commit, not a build that breaks on a Tuesday.
          version: v2.12.2

      - name: Test
        # The tests that need a kernel skip for an unprivileged user, which is
        # what this job is. The kernel job below is where they are made to run.
        run: go test -race -shuffle=on ./...

  generated:
    name: generated bindings are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # bpf2go output is committed so that `go build` works on a fresh clone
    # with no clang in sight. Committed generated code drifts from its source
    # the first time somebody edits the C and forgets to regenerate, and the
    # result is a binary that quietly runs the previous program.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev

      - name: Regenerate
        run: make generate

      - name: The Go bindings must match the C
        # Only the generated Go is compared. The embedded object is not: the
        # runner has clang 18 and this is developed against clang 19, and two
        # clang versions produce different bytes from identical source. A byte
        # comparison would fail for a reason that has nothing to do with
        # drift, and a check that cries wolf gets deleted.
        #
        # The Go side is derived from BTF -- the maps, the programs, the
        # variables and the struct layouts -- so it changes exactly when the
        # interface between kernel and userspace changes, which is the drift
        # worth catching.
        run: git diff --exit-code -- '*_bpfel.go'

  kernel:
    name: load into a real kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The assumption this job exists to test: that a hosted runner has BTF and
    # will let a program be loaded with sudo. It is plausible and it is load
    # bearing -- if it is false, every phase after this one needs a different
    # CI strategy -- so it is checked on the first day rather than assumed for
    # three months. A pipeline that only compiles proves nothing: clang
    # accepts programs the verifier rejects, and the verifier is the hard part.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev

      - name: Record what kernel this runner is
        # Never allowed to fail the job, and that matters more now that
        # pipefail is on: the loop below pipes `cat` into `sed` over tracepoint
        # format files, and a tracepoint that stopped existing would take the
        # whole job down instead of leaving a gap in the notes. This step is
        # here to make failures diagnosable; it must not be able to cause one.
        continue-on-error: true
        # Recorded because the runner image changes without asking, and when a
        # load starts failing the first question is what moved. An assertion
        # that passed against an unrecorded kernel is not evidence of much.
        #
        # Piped through tee into both the job summary and the log. The summary
        # is the readable one; the log is the one that is still there when the
        # question is asked weeks later against a run nobody thought to look at.
        run: |
          {
            echo '### Runner kernel'
            echo
            echo '```'
            echo "uname -r        $(uname -r)"
            echo "BTF             $(ls -l /sys/kernel/btf/vmlinux 2>&1)"
            echo "cgroup fs       $(stat -fc %T /sys/fs/cgroup)"
            echo "controllers     $(cat /sys/fs/cgroup/cgroup.controllers)"
            echo "clang           $(clang --version | head -1)"
            echo '```'
            echo
            echo '### Scheduler tracepoint layouts'
            echo
            # The programs declare these context structs from the format
            # files. The layout is stable ABI and the *size* is not promised,
            # and the kernel refuses to attach a program whose highest context
            # read is past the end of the tracepoint -- with EACCES, which
            # reads as "permission denied" and looks like anything but an
            # offset problem. Recording them makes that diagnosable.
            echo '```'
            for tp in sched_switch sched_wakeup sched_process_fork; do
              echo "--- $tp"
              sudo cat "/sys/kernel/tracing/events/sched/$tp/format" | sed -n '/^\tfield:/p'
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the host against the requirements
        # preflight ends by loading a two-instruction program, so this step
        # fails on a runner that cannot run this project at all -- and says
        # which requirement was the one missing.
        run: |
          make build
          sudo ./bin/wallclock preflight | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compile, load and attach
        # make smoke sets WALLCLOCK_REQUIRE_BPF=1, which turns the
        # unprivileged skip inside the test into a failure. Without it a
        # runner that refused to load anything would report a green tick for
        # a suite that did nothing.
        run: make smoke

  kernel-matrix:
    name: kernel ${{ matrix.kernel }}
    runs-on: ubuntu-latest
    # Fifteen rather than twenty-five, and each vimto call is wrapped in a
    # timeout of its own below. A guest that cannot start the binary handed to
    # it does not fail -- it waits, and the only thing that ends the wait is a
    # deadline. Two rounds of this were spent watching six jobs sit still.
    timeout-minutes: 15
    # Everything here runs inside the guest, and the guest takes /lib from the
    # kernel image -- which carries modules, not a libc. A Go binary linked
    # against the host's libc finds nothing to link against and never starts,
    # which presents as a hang rather than as an error: `ldd bin/wallclock` on
    # an ordinary build lists libc.so.6, and with this it says "not a dynamic
    # executable".
    #
    # vimto needs the same thing for the same reason and says so when it is
    # missing. This binary says nothing at all.
    env:
      CGO_ENABLED: "0"
    # A CO-RE tool that has only ever run on the kernel it was written against
    # has not demonstrated the thing CO-RE is for. The job above proves the
    # programs load on the runner's kernel, and the runner offers exactly one.
    #
    # This project has already been bitten by the class of bug this catches.
    # `sched_process_fork` grew a `__data_loc` field between 6.6 and 6.17,
    # every offset after it moved, and the read of `child_pid` landed past the
    # end of the record. The kernel refuses to attach such a program with
    # EACCES, which reads as a permissions problem and is not one. That was
    # found by accident, because CI happened to run a different kernel from
    # the development machine. Finding it on purpose is what this job is.
    #
    # vimto and the kernel images come from the cilium/ebpf project, whose
    # library this tool is built on and whose CI runs the same way. Borrowing
    # their images rather than building kernels here is the difference between
    # half a day and a week.
    strategy:
      fail-fast: false
      matrix:
        include:
          # 5.10 is the oldest kernel this claims to support that has an
          # image; 5.15, 6.1 and 6.6 are the LTS releases in between; stable
          # is whatever is current, so this job starts failing when the
          # future arrives rather than when somebody remembers to look.
          - kernel: "5.10"
          - kernel: "5.15"
          - kernel: "6.1"
          - kernel: "6.6"
          - kernel: "stable"
          # Below the floor, and the assertion inverts: the requirement is
          # 5.8, so on 5.4 the tool has to refuse and say which requirement
          # failed. A stated minimum that has never been tested from
          # underneath is a comment, not a requirement -- and the failure it
          # guards against is the ugly kind, where an unsupported kernel
          # produces numbers instead of an error.
          - kernel: "5.4"
            expect: refuse
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev

      - name: Install vimto and QEMU
        # CGO_ENABLED=0 is required rather than tidy: vimto refuses to run
        # `exec` unless it is itself statically linked, because it has to copy
        # itself into the guest to act as init. Built dynamically it fails
        # with "binary is not statically linked", which is a sentence about
        # vimto and reads like one about the program being tested.
        run: |
          CGO_ENABLED=0 go install lmb.io/vimto@latest
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          sudo chmod 0666 /dev/kvm

      - name: Build the binary the guest will run
        run: make bpf build

      # There is no separate step probing what the guest offers, and there was
      # one. It ran a multi-line `/bin/sh -c` through the guest and hung all
      # six kernels for twenty-five minutes, which is how a bespoke shell
      # script earns its removal rather than its debugging.
      #
      # `preflight` reports the same facts -- release, BTF, cgroup version,
      # the cpu controller -- by attempting each one, and it is the project's
      # own environment prober. Using it here rather than reimplementing it in
      # sh means the evidence and the assertion are the same command.
      - name: The requirements, checked from inside the guest
        if: matrix.expect != 'refuse'
        # preflight attempts each requirement rather than inspecting for it,
        # so this fails on a kernel that cannot run the tool and names the
        # requirement that was missing.
        #
        # `exec` rather than a bare command: vimto dispatches on its first
        # argument, and anything that is not `exec`, `flush-cache` or a `go`
        # toolchain invocation is rejected as an unknown command -- naming the
        # binary, which reads like the binary is missing.
        run: |
          timeout 300 vimto -kernel ":${{ matrix.kernel }}" exec -- ./bin/wallclock preflight \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Load, attach, and run every kernel test
        if: matrix.expect != 'refuse'
        # `go test` under vimto compiles on the runner and executes inside the
        # guest, which is the split this needs: the guest takes /usr and /lib
        # from the kernel image, so it has no Go toolchain and no make, and
        # each package still runs from its own directory the way the tests
        # expect.
        #
        # WALLCLOCK_REQUIRE_BPF turns the unprivileged skip into a failure and
        # reaches the guest because vimto passes the environment through. It
        # is what stops a VM that quietly loads nothing from reporting a green
        # tick for a suite that did nothing -- the failure this whole job is
        # most likely to have.
        env:
          WALLCLOCK_REQUIRE_BPF: "1"
        run: |
          timeout 600 vimto -kernel ":${{ matrix.kernel }}" -- go test -count 1 -v \
            ./internal/bpfload ./internal/syscount ./internal/offcpu ./internal/netlat \
            2>&1 | tee /tmp/kernel-tests.log
          # Belt and braces on top of WALLCLOCK_REQUIRE_BPF, because the way
          # this job fails silently is by running nothing at all.
          passed=$(grep -c '^--- PASS' /tmp/kernel-tests.log || true)
          echo "$passed tests passed on ${{ matrix.kernel }}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$passed" -lt 10 ]; then
            echo "only $passed tests ran; this suite has far more than that" >&2
            exit 1
          fi

      - name: On a kernel below the floor, refuse and say why
        if: matrix.expect == 'refuse'
        # Asserted on the exit status and on the message. A tool that exits
        # non-zero for the wrong reason passes a status check and still
        # misleads whoever reads the output.
        run: |
          set +e
          out=$(timeout 300 vimto -kernel ":${{ matrix.kernel }}" exec -- ./bin/wallclock preflight 2>&1)
          status=$?
          set -e
          {
            echo "### ${{ matrix.kernel }}, expected to be refused"
            echo
            echo '```'
            echo "$out"
            echo "exit status: $status"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 0 ]; then
            echo "preflight accepted a kernel below the stated minimum of 5.8" >&2
            exit 1
          fi
          echo "$out" | grep -qiE '5\.8|too old|minimum|kernel' || {
            echo "preflight refused, but not for a reason a reader can act on" >&2
            exit 1
          }
