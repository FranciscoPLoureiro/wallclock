name: CI

on:
  push:
    branches: [main]
  # No branch filter. Phases are built on branches that stack on the previous
  # one while it waits to be merged, and a pull request whose base is another
  # branch is still a pull request that has to be green before anyone reads
  # it. Restricting this to main meant the phase 1 branch ran no CI at all,
  # which was only noticed because the run list came back empty.
  pull_request:

# A run whose commit has already been superseded tells nobody anything and
# occupies a runner that the current commit needs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

# Every `run:` step gets `bash --noprofile --norc -eo pipefail` instead of the
# default `bash -e`, and the difference is pipefail.
#
# Without it a pipeline exits with the status of its *last* command, so
# `wallclock preflight | tee -a "$GITHUB_STEP_SUMMARY"` below reports what tee
# did, which is succeed. That step carries a comment saying it fails on a
# runner that cannot run this project, and it could not fail at all -- a check
# incapable of failing, in a repository whose recurring lesson is exactly
# that.
defaults:
  run:
    shell: bash

jobs:
  verify:
    name: build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Read the version from go.mod so the toolchain can never drift
          # away from what the module declares.
          go-version-file: go.mod
          cache: true

      - name: Install the BPF toolchain
        # clang cross-compiles to BPF, llvm supplies llvm-strip, and
        # libbpf-dev supplies the bpf_helpers.h the programs include. The
        # runner image already carries a clang, but not necessarily an
        # unversioned llvm-strip, and not libbpf's headers.
        #
        # Bounded, because unbounded is how this fails. apt waits on a
        # stalled mirror for as long as the mirror likes; twice in a row two
        # of the three jobs sat in this step until timeout-minutes killed
        # them, and GitHub reports a job killed that way as `cancelled` --
        # which the README badge renders as failing, on a green commit.
        #
        # The retries and the per-connection timeout turn an indefinite stall
        # into an error with a message. The step timeout is the backstop for
        # anything they do not cover: five minutes is generous for three
        # packages, and it fails this step rather than eating the job.
        timeout-minutes: 5
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y --no-install-recommends clang llvm libbpf-dev

      - name: Verify go.mod is tidy
        # A stale go.mod passes locally and fails for the next person to
        # clone. Cheaper to catch here than in someone else's checkout.
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Compile the BPF programs
        run: make bpf

      - name: Build
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned rather than "latest": a new release adding a check should
          # be a deliberate commit, not a build that breaks on a Tuesday.
          version: v2.12.2

      - name: Test
        # The tests that need a kernel skip for an unprivileged user, which is
        # what this job is. The kernel job below is where they are made to run.
        run: go test -race -shuffle=on ./...

  generated:
    name: generated bindings are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # bpf2go output is committed so that `go build` works on a fresh clone
    # with no clang in sight. Committed generated code drifts from its source
    # the first time somebody edits the C and forgets to regenerate, and the
    # result is a binary that quietly runs the previous program.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the BPF toolchain
        # Bounded, because unbounded is how this fails. apt waits on a
        # stalled mirror for as long as the mirror likes; twice in a row two
        # of the three jobs sat in this step until timeout-minutes killed
        # them, and GitHub reports a job killed that way as `cancelled` --
        # which the README badge renders as failing, on a green commit.
        #
        # The retries and the per-connection timeout turn an indefinite stall
        # into an error with a message. The step timeout is the backstop for
        # anything they do not cover: five minutes is generous for three
        # packages, and it fails this step rather than eating the job.
        timeout-minutes: 5
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y --no-install-recommends clang llvm libbpf-dev

      - name: Regenerate
        run: make generate

      - name: The Go bindings must match the C
        # Only the generated Go is compared. The embedded object is not: the
        # runner has clang 18 and this is developed against clang 19, and two
        # clang versions produce different bytes from identical source. A byte
        # comparison would fail for a reason that has nothing to do with
        # drift, and a check that cries wolf gets deleted.
        #
        # The Go side is derived from BTF -- the maps, the programs, the
        # variables and the struct layouts -- so it changes exactly when the
        # interface between kernel and userspace changes, which is the drift
        # worth catching.
        run: git diff --exit-code -- '*_bpfel.go'

  kernel:
    name: load into a real kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The assumption this job exists to test: that a hosted runner has BTF and
    # will let a program be loaded with sudo. It is plausible and it is load
    # bearing -- if it is false, every phase after this one needs a different
    # CI strategy -- so it is checked on the first day rather than assumed for
    # three months. A pipeline that only compiles proves nothing: clang
    # accepts programs the verifier rejects, and the verifier is the hard part.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the BPF toolchain
        # Bounded, because unbounded is how this fails. apt waits on a
        # stalled mirror for as long as the mirror likes; twice in a row two
        # of the three jobs sat in this step until timeout-minutes killed
        # them, and GitHub reports a job killed that way as `cancelled` --
        # which the README badge renders as failing, on a green commit.
        #
        # The retries and the per-connection timeout turn an indefinite stall
        # into an error with a message. The step timeout is the backstop for
        # anything they do not cover: five minutes is generous for three
        # packages, and it fails this step rather than eating the job.
        timeout-minutes: 5
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y --no-install-recommends clang llvm libbpf-dev

      - name: Record what kernel this runner is
        # Never allowed to fail the job, and that matters more now that
        # pipefail is on: the loop below pipes `cat` into `sed` over tracepoint
        # format files, and a tracepoint that stopped existing would take the
        # whole job down instead of leaving a gap in the notes. This step is
        # here to make failures diagnosable; it must not be able to cause one.
        continue-on-error: true
        # Recorded because the runner image changes without asking, and when a
        # load starts failing the first question is what moved. An assertion
        # that passed against an unrecorded kernel is not evidence of much.
        #
        # Piped through tee into both the job summary and the log. The summary
        # is the readable one; the log is the one that is still there when the
        # question is asked weeks later against a run nobody thought to look at.
        run: |
          {
            echo '### Runner kernel'
            echo
            echo '```'
            echo "uname -r        $(uname -r)"
            echo "BTF             $(ls -l /sys/kernel/btf/vmlinux 2>&1)"
            echo "cgroup fs       $(stat -fc %T /sys/fs/cgroup)"
            echo "controllers     $(cat /sys/fs/cgroup/cgroup.controllers)"
            echo "clang           $(clang --version | head -1)"
            echo '```'
            echo
            echo '### Scheduler tracepoint layouts'
            echo
            # The programs declare these context structs from the format
            # files. The layout is stable ABI and the *size* is not promised,
            # and the kernel refuses to attach a program whose highest context
            # read is past the end of the tracepoint -- with EACCES, which
            # reads as "permission denied" and looks like anything but an
            # offset problem. Recording them makes that diagnosable.
            echo '```'
            for tp in sched_switch sched_wakeup sched_process_fork; do
              echo "--- $tp"
              sudo cat "/sys/kernel/tracing/events/sched/$tp/format" | sed -n '/^\tfield:/p'
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the host against the requirements
        # preflight ends by loading a two-instruction program, so this step
        # fails on a runner that cannot run this project at all -- and says
        # which requirement was the one missing.
        run: |
          make build
          sudo ./bin/wallclock preflight | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compile, load and attach
        # make smoke sets WALLCLOCK_REQUIRE_BPF=1, which turns the
        # unprivileged skip inside the test into a failure. Without it a
        # runner that refused to load anything would report a green tick for
        # a suite that did nothing.
        run: make smoke

  matrix:
    name: load and test across kernels
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The README's strongest claim is that one compiled object loads on any
    # kernel new enough, and until this job existed nothing checked it. The
    # evidence was a table somebody produced by hand, once, on their own
    # machine -- which is the shape of claim this project spends its comments
    # warning about.
    #
    # This is also the job that could not be made to work for seven rounds.
    # The cause was never vimto and never the binary: GitHub's runners carry
    # /dev/kvm and do not make it readable by the runner user, so QEMU falls
    # back to software emulation and a guest that would finish in under a
    # second instead runs until the deadline kills it. A hang and a
    # thirty-times-slower machine are indistinguishable from outside.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Give the runner access to KVM
        # The device node exists without this and cannot be opened. The udev
        # rule is the documented workaround and is what every project running
        # emulators in Actions uses.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: KVM has to actually work
        # Asserted rather than hoped for, and this is the whole lesson of the
        # first attempt. Without KVM nothing here fails: it gets slow, every
        # guest times out, and the job reports a hang whose cause is nowhere
        # in the log. A missing accelerator has to be a named failure on the
        # step that owns it.
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends qemu-system-x86
          test -r /dev/kvm && test -w /dev/kvm || {
            echo "/dev/kvm is not usable by $(id -un); guests would be emulated" >&2
            ls -l /dev/kvm >&2 || echo "and the device node is not there at all" >&2
            exit 1
          }
          # `-accel help` lists what qemu was compiled with, not what it can
          # use here, so it is asked to actually initialise the accelerator.
          # Attempting the operation is the rule everywhere else in this
          # repository and it belongs here most of all: the failure this guards
          # against does not raise an error, it makes everything thirty times
          # slower.
          out=$(timeout 10 qemu-system-x86_64 -accel kvm -display none                   -nodefaults -m 64 -no-reboot 2>&1) || true
          if printf '%s' "$out" | grep -qiE 'kvm.*(unavailable|not (supported|available)|fail|denied|no such)'; then
            echo "qemu could not use kvm:" >&2; printf '%s\n' "$out" >&2; exit 1
          fi
          echo "kvm: $(ls -l /dev/kvm)"
          echo "nested: $(grep -c -E '^flags.*(vmx|svm)' /proc/cpuinfo) cpus expose virtualisation"

      - name: Install the BPF toolchain
        # The guests run compiled test binaries, and two of those load fixture
        # objects -- programs written to be refused, compiled next to the test
        # that asserts the refusal. Those objects are generated rather than
        # committed, so without clang here the suite fails identically on
        # every kernel for a reason that has nothing to do with any of them,
        # which is how it failed the first time this job got as far as running.
        timeout-minutes: 5
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y --no-install-recommends clang llvm libbpf-dev

      - name: Install vimto
        # Statically linked because vimto copies itself into the guest as its
        # init, and the guest has no libc to link it against.
        run: CGO_ENABLED=0 go install lmb.io/vimto@latest

      - name: Load and test on every kernel
        # A subset of what `make matrix` runs locally, chosen for span rather
        # than for count: one below the 5.8 floor where the tool has to
        # refuse, and four above it either side of the versions this is
        # developed and released on. The full set, and the distribution cloud
        # images that can exercise cgroup throttling, stay a local target --
        # those images are hundreds of megabytes each.
        env:
          # One below the 5.8 floor where the tool has to refuse, and four
          # above it. The deadline is per guest and generous: a working one
          # finishes in seconds, so four minutes is there to catch a hang
          # rather than to race a slow boot -- and short enough that a job
          # where every guest fails still finishes inside its own budget and
          # gets to say why. The first run of this did not, and was killed
          # holding the only evidence it had produced.
          KERNELS: "5.4 5.15 6.1 6.6 stable"
          DEADLINE: "240"
        run: make matrix | tee -a "$GITHUB_STEP_SUMMARY"

      - name: What the guests said
        # Printed into the summary rather than only uploaded, because the
        # question after a row says "no result" is what the guest managed
        # before it stopped, and that should not need a download.
        if: always()
        run: |
          for log in build/matrix/*.log; do
            [ -e "$log" ] || continue
            echo "<details><summary>$(basename "$log")</summary>"
            echo
            echo '```'
            tail -c 4000 "$log"
            echo '```'
            echo '</details>'
          done >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        # `always()`, not `failure()`. A job killed by its own timeout is
        # *cancelled*, and failure() is false for a cancellation -- so the
        # first run of this job threw away the only evidence it produced.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-matrix-logs
          path: build/matrix/
          retention-days: 7
